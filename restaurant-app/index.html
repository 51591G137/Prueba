<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Restaurante</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; max-width: 800px; margin: auto; }
    section { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
    input, select, button { margin: 0.25rem; padding: 0.5rem; }
    ul { list-style: none; padding-left: 0; }
    li { background: #f9f9f9; margin: 0.25rem 0; padding: 0.5rem; }
  </style>
</head>
<body>
  <h1>🍽️ App Restaurante</h1>

  <!-- Usuarios -->
  <section>
    <h2>Usuarios</h2>
    <input id="userName" placeholder="Nombre de usuario">
    <input id="userEmail" placeholder="Email">
    <button onclick="crearUsuario()">Crear usuario</button>
    <h3>Seleccionar usuario</h3>
    <select id="userSelect" onchange="cargarRestaurantes()"></select>
  </section>

  <!-- Restaurantes -->
  <section>
    <h2>Restaurantes</h2>
    <input id="restName" placeholder="Nombre del restaurante">
    <button onclick="crearRestaurante()">Crear restaurante</button>
    <h3>Seleccionar restaurante</h3>
    <select id="restSelect" onchange="cargarMesasEItems()"></select>
  </section>

  <!-- Mesas -->
  <section>
    <h2>Mesas</h2>
    <input id="tableNumber" placeholder="Número de mesa">
    <input id="tableCapacity" type="number" placeholder="Capacidad">
    <button onclick="crearMesa()">Añadir mesa</button>
    <ul id="listaMesas"></ul>
  </section>

  <!-- Items del menú -->
  <section>
    <h2>Menú</h2>
    <input id="itemName" placeholder="Nombre del plato">
    <input id="itemDesc" placeholder="Descripción">
    <input id="itemPrice" type="number" step="0.01" placeholder="Precio">
    <button onclick="crearItem()">Añadir plato</button>
    <ul id="listaItems"></ul>
  </section>

  <!-- Reservas -->
  <section>
    <h2>Reservas (hoy)</h2>
    <button onclick="cargarReservas()">Ver reservas de hoy</button>
    <ul id="listaReservas"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
