<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Cliente</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; max-width: 800px; margin: auto; }
    section { border: 1px solid #ccc; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
    input, select, button { margin: 0.25rem; padding: 0.5rem; }
    ul { list-style: none; padding-left: 0; }
    li { background: #f9f9f9; margin: 0.25rem 0; padding: 0.5rem; }
  </style>
</head>
<body>
  <h1>👤 App Cliente</h1>

  <!-- Clientes -->
  <section>
    <h2>Clientes</h2>
    <input id="custName" placeholder="Nombre">
    <input id="custEmail" placeholder="Email">
    <button onclick="crearCliente()">Crear cliente</button>
    <h3>Seleccionar cliente</h3>
    <select id="custSelect"></select>
  </section>

  <!-- Restaurantes -->
  <section>
    <h2>Restaurantes disponibles</h2>
    <button onclick="cargarRestaurantes()">Mostrar restaurantes</button>
    <select id="restSelect" onchange="cargarMesasEItems()"></select>
    <div id="detalleRestaurante"></div>
  </section>

  <!-- Mesas e items -->
  <section>
    <h2>Mesas y menú</h2>
    <div id="mesasContainer"></div>
    <div id="itemsContainer"></div>
  </section>

  <!-- Reserva -->
  <section>
    <h2>Reservar mesa</h2>
    <select id="reservaMesaSelect"></select>
    <input id="reservaFecha" type="datetime-local">
    <button onclick="reservar()">Reservar</button>
  </section>

  <script src="app.js"></script>
</body>
</html>
