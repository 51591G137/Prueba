name: Construir APKs (Restaurante y Cliente)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        app: [restaurant, client]
    
    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Construir la App nativa (Wrapper)
      run: |
        # Determinar nombres según la matriz
        if [ "${{ matrix.app }}" = "restaurant" ]; then
          APP_ID="com.mirestaurante.restaurant"
          APP_NAME="Restaurante Admin"
          WEB_DIR="restaurant-app"
        else
          APP_ID="com.mirestaurante.client"
          APP_NAME="Restaurante Cliente"
          WEB_DIR="client-app"
        fi

        mkdir app-movil
        cd app-movil
        npm init -y
        # Fijamos Capacitor 7 para estabilidad
        npm install @capacitor/cli@7 @capacitor/core@7 @capacitor/android@7
        
        # Copiamos el frontend correspondiente a www
        mkdir www
        cp -r ../$WEB_DIR/* www/
        
        # Generamos la configuración de Capacitor
        cat <<EOF > capacitor.config.json
        {
          "appId": "$APP_ID",
          "appName": "$APP_NAME",
          "webDir": "www",
          "bundledWebRuntime": false,
          "server": {
            "url": "https://prueba-defz.onrender.com/",
            "cleartext": true
          }
        }
        EOF
        
        npx cap add android

    - name: Compilar el APK de Android
      run: |
        cd app-movil/android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Subir el APK final
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ matrix.app }}
        path: app-movil/android/app/build/outputs/apk/debug/app-debug.apk