name: Construir APK (Capacitor)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Configurar Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Construir la App nativa (Wrapper)
      run: |
        mkdir app-movil
        cd app-movil
        npm init -y
        npm install @capacitor/cli @capacitor/core @capacitor/android
        
        mkdir www
        echo "<html><body>Cargando motor de Python...</body></html>" > www/index.html
        
        npx cap init "Mi Restaurante" "com.mirestaurante.app" --web-dir www
        
        cat << 'EOF' > capacitor.config.json
        {
          "appId": "com.mirestaurante.app",
          "appName": "Mi Restaurante",
          "webDir": "www",
          "bundledWebRuntime": false,
          "server": {
            "url": "https://prueba-defz.onrender.com/",
            "cleartext": true
          }
        }
        EOF
        
        npx cap add android

    - name: Compilar el APK de Android
      run: |
        cd app-movil/android
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Subir el APK final
      uses: actions/upload-artifact@v4
      with:
        name: mi-restaurante-apk
        path: app-movil/android/app/build/outputs/apk/debug/app-debug.apk
