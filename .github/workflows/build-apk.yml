name: Construir APK Definitivo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: 1. Descargar el código
      uses: actions/checkout@v4

    - name: 2. Configurar Node.js (Sin warnings)
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: 3. Configurar Java (Sin warnings)
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 4. Instalar Bubblewrap y utilidades
      run: |
        npm install -g @bubblewrap/cli
        sudo apt-get update && sudo apt-get install -y jq

    - name: 5. Crear certificado de seguridad propio (Evita bloqueos)
      run: |
        keytool -genkeypair -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass 12345678 -keypass 12345678 -dname "CN=App,O=App,C=ES"

    - name: 6. Inyectar certificado en tu configuración sin tocar tu código
      run: |
        jq '.signingKey = {"path": "android.keystore", "alias": "android"}' twa-manifest.json > temp.json
        mv temp.json twa-manifest.json

    - name: 7. Configurar rutas para la máquina
      run: |
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

    - name: 8. Compilar el APK (Forzando contraseñas y saltando validaciones)
      run: |
        printf "12345678\n12345678\n" | bubblewrap build --skipPwaValidation
      
    - name: 9. Guardar el APK final
      uses: actions/upload-artifact@v4
      with:
        name: mi-restaurante-apk
        path: '**/*.apk'
