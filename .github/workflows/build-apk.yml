name: Construir APK de Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Instalar Java
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Instalar Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Configurar rutas de Android
      run: |
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

    - name: Generar carpetas de Android (Sin preguntas)
      run: |
        yes | bubblewrap init --manifest=twa-manifest.json
      
    - name: Compilar APK (Modo prueba, sin contraseñas)
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
      
    - name: Guardar el archivo APK generado
      uses: actions/upload-artifact@v4
      with:
        name: mi-restaurante-apk
        path: '**/*.apk'
