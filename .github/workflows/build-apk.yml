name: Construir APK de Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    
    steps:
    - name: Descargar el código
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24' # Soluciona el aviso de Node.js

    - name: Instalar Java
      uses: actions/setup-java@v5 # Soluciona el aviso de Java
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Instalar Bubblewrap
      run: npm install -g @bubblewrap/cli

    - name: Configurar rutas para que la máquina no haga preguntas
      run: |
        mkdir -p ~/.bubblewrap
        echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json

    - name: Compilar el APK (Respondiendo contraseñas automáticamente)
      run: |
        yes "12345678" | bubblewrap build --manifest=twa-manifest.json
      
    - name: Guardar el archivo APK generado
      uses: actions/upload-artifact@v4
      with:
        name: mi-restaurante-apk
        path: '**/*.apk'
